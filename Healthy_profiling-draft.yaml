          icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
          description: "编写代码，处理输入变量来生成返回值"
          version: v2
          position:
            x: 940.0928107683449
            y: 566.3639646135354
          parameters:
            code: |-
                async def main(input):
                    map_q1 = {
                        "怕冷": "A",
                        "怕热": "B",
                        "正常": "C",
                        "冷热都怕": "D"
                    }
                    map_q2 = {
                        "容易出汗": "A",
                        "很少出汗": "B",
                        "正常": "C",
                        "晚上睡觉出汗": "D"
                    }
                    map_q3 = {
                        "经常口干": "A",
                        "很少口干": "B",
                        "正常": "C",
                        "口苦": "D"
                    }
                    map_q4 = {
                        "偏软不成形": "A",
                        "偏干硬": "B",
                        "正常": "C",
                        "时干时稀": "D"
                    }

                    def text_to_opt(raw_text, mapping):
                        if raw_text is None:
                            return None
                        s = str(raw_text).strip()
                        if s in ["A", "B", "C", "D", "E"]:
                            return s
                        for txt, opt in mapping.items():
                            if txt in s:
                                return opt
                        return None

                    params = input.params
                    raw_q1 = params.get("optionid1") or params.get("optionId1") or params.get("Q1") or params.get("q1")
                    raw_q2 = params.get("optionid2") or params.get("optionId2") or params.get("Q2") or params.get("q2")
                    raw_q3 = params.get("optionid3") or params.get("optionId3") or params.get("Q3") or params.get("q3")
                    raw_q4 = params.get("optionid4") or params.get("optionId4") or params.get("Q4") or params.get("q4")

                    q1 = text_to_opt(raw_q1, map_q1)
                    q2 = text_to_opt(raw_q2, map_q2)
                    q3 = text_to_opt(raw_q3, map_q3)
                    q4 = text_to_opt(raw_q4, map_q4)

                    if all(v is None for v in [q1, q2, q3, q4]):
                        return {
                            "constitution_type": "参数错误",
                            "physique_desc": "未能识别答案文本，请确认传入的内容和问卷选项文字匹配"
                        }

                    scores = {
                        "平和": 0, "气虚": 0, "阳虚": 0, "阴虚": 0,
                        "痰湿": 0, "湿热": 0, "血瘀": 0, "气郁": 0, "特禀": 0
                    }

                    if q1 == "A":
                        scores["阳虚"] += 5
                    elif q1 == "B":
                        scores["阴虚"] += 3
                        scores["湿热"] += 2
                    elif q1 == "C":
                        scores["平和"] += 2
                    elif q1 == "D":
                        scores["气虚"] += 2
                        scores["阳虚"] += 2

                    if q2 == "A":
                        scores["气虚"] += 4
                        scores["阳虚"] += 2
                    elif q2 == "B":
                        scores["阳虚"] += 3
                        scores["血瘀"] += 2
                    elif q2 == "C":
                        scores["平和"] += 2
                    elif q2 == "D":
                        scores["阴虚"] += 4

                    if q3 == "A":
                        if q1 == "A":
                            scores["阳虚"] += 4
                        else:
                            scores["阴虚"] += 4
                            scores["湿热"] += 2
                    elif q3 == "B":
                        scores["平和"] += 2
                        scores["痰湿"] += 1
                    elif q3 == "C":
                        scores["平和"] += 2
                    elif q3 == "D":
                        scores["湿热"] += 3
                        scores["气郁"] += 2

                    if q4 == "A":
                        scores["气虚"] += 2
                        scores["阳虚"] += 2
                        scores["痰湿"] += 3
                    elif q4 == "B":
                        scores["阴虚"] += 3
                        scores["湿热"] += 1
                    elif q4 == "C":
                        scores["平和"] += 2
                    elif q4 == "D":
                        scores["气郁"] += 4
                        scores["气虚"] += 2

                    max_score = max(scores.values())
                    top_list = [k for k, v in scores.items() if v == max_score]

                    if max_score < 4:
                        physique = "平和"
                    else:
                        if len(top_list) == 1:
                            physique = top_list[0]
                        else:
                            priority = ["阳虚", "气郁", "气虚", "阴虚", "湿热", "痰湿", "血瘀", "特禀", "平和"]
                            physique = top_list[0]
                            for p in priority:
                                if p in top_list:
                                    physique = p
                                    break

                    desc_map = {
                        "平和": "各方面比较均衡，跟着节气吃就好。",
                        "气虚": "山药、莲子、红枣这类家常食材比较合适。",
                        "阳虚": "生姜、核桃、羊肉这类温热的更合适，生冷的少吃一点。",
                        "阴虚": "银耳、雪梨、鸭肉这类滋润的更合适，辛辣的少吃一点。",
                        "痰湿": "冬瓜、薏米、陈皮这类更清爽，甜腻的少吃一点。",
                        "湿热": "苦瓜、绿豆这类更清爽，油炸辛辣的少吃一点。",
                        "血瘀": "山楂、黑木耳这类可以常吃，生冷的少吃一点。",
                        "气郁": "陈皮、玫瑰花泡水比较合适。",
                        "特禀": "发物类少吃一点，推荐时会先帮你筛一遍。"
                    }
                    physique_desc = desc_map.get(physique, "这方面信息还不完整，跟着节气吃就好。")

                    return {
                        "constitution_type": physique,
                        "physique_desc": physique_desc
                    }
            language: 3
